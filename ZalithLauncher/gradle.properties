# launcher name & url
# 【不要改】launcher_name 是内部标识符（BuildKeys.LAUNCHER_IDENTIFIER）：
#   MMKV 存储 id、versions/<实例>/ 目录名、剪贴板 label 都来自它；
#   改了等于所有设置、实例、登录态凭空消失，要改必须单独做数据迁移。
#   GPLv3 §7(c) 约束的是「分发时的程序名」，对应下面的 launcher_app_name。
launcher_name=ZalithLauncher
# 界面显示名（顶栏、关于页、崩溃页、启动参数里的 launcher brand）。
# 【GPLv3 第 7 条附加条款】改名不得包含上游原名 ZalithLauncher / 缩写 ZL。
# 旧名 `Zalith-Plain Craft Launcher` 与短名 `ZL2` 都违反这一条，已换成中性的 ZPCL。
launcher_app_name=\u65E0\u5C3D\u8D2A\u5A6A-\u6B32\u671B\u7EC8\u7AE0
launcher_short_name=ZPCL
# 本项目仓库；上游仓库在 README / NOTICE 里另行署名
url_home=https://github.com/zuanxu53-hub/Zalith-PlainCraftLauncher

# your OAuth client id
#oauth_client_id=xxx

# your CurseForge API key
#curseforge_api_key=xxx

# default key, please add it yourself.

# launcher version
# 显示版本号改为 1.0（本项目独立版本线）；versionCode 保持 200043 不变，
# 避免破坏自动更新的升级链比较。
launcher_version_code=200076
launcher_version_name=1.5.4
